spring:
  jpa:
    show-sql: ${IS_DEV:true}
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
  h2:
    console:
      path: /h2-console
      enabled: ${IS_DEV:true}
      settings:
        web-allow-others: ${IS_DEV:true}
  datasource:
    url: jdbc:h2:file:./data
    username: sa
    password: sa
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:password}

camunda:
  client:
    mode: selfmanaged
    auth:
      method: none
    grpc-address: http://${CAMUNDA_GRPC_HOST:127.0.0.1:26500}
    rest-address: http://${CAMUNDA_GRPC_HOST:127.0.0.1:8088}
server:
  port: ${SERVER_PORT:9999}
springdoc:
  api-docs:
    enabled: ${IS_DEV:true}
  swagger-ui:
    enabled: ${IS_DEV:true}
    path: /v3/swagger
