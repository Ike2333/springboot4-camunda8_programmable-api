spring:
  application:
    name: sb4camunda8
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      path: /h2-console
      enabled: true
  datasource:
    url: jdbc:h2:mem:test
    username: sa
    password: sa
  data:
    redis:
      host: 127.0.0.1
      port: 6379

camunda:
  client:
    mode: selfmanaged
    auth:
      method: none
    grpc-address: http://127.0.0.1:26500
server:
  port: 9999
